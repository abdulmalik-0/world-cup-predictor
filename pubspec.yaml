name: world_cup_predictor
description: تحدي مونديال الشركة — Company World Cup Predictor
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.4
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  video_player: ^2.9.2
  path_drawing: ^1.0.1
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/wc26_logo.png
    - assets/images/fifa-world-cup-2026--white.png
    - assets/images/background.png
    - assets/images/hero_poster.webp
    - assets/images/trophy.png
    - assets/images/malaz_logo.svg
    - assets/images/wc_action.webp
    - assets/images/gallery1.webp
    - assets/video/hero.mp4
